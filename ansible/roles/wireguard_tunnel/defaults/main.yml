---
wg_interface: wg0

# Tunnel address for THIS host, CIDR form, e.g. "10.77.0.1/24"
wg_address: ""

# Only set on the side that should accept inbound connections
# (typically the central Zabbix server, behind a DNAT'd public port)
wg_listen_port: ""

# Set via vault (group_vars/*/vault.yml). If left empty, a fresh keypair is
# generated on first run and the public key is printed for you to hand to
# the peer - nothing sensitive is ever logged.
wg_private_key: ""

wg_peer_public_key: ""
wg_peer_allowed_ips: ""

# Only set on the side that dials out (the proxy connecting to the server)
wg_peer_endpoint: ""

wg_persistent_keepalive: 25

# Hub side only (the central Zabbix server): a list of
# {public_key, allowed_ips} - one entry per customer, all sharing this one
# interface/port. Leave empty on a spoke (proxy) host, which uses the
# single wg_peer_* vars above instead.
wg_peers: []
