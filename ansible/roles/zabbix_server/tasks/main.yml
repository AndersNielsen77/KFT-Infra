---
# Central Zabbix server: PostgreSQL backend + nginx/php-fpm frontend.
#
# Every step here reflects a snag hit building this by hand on 2026-07-18 -
# see the inline notes. Re-running this role against a freshly-provisioned
# CT (e.g. after Terraform recreates it) should reproduce a working server
# without re-discovering any of them.

- name: Add Zabbix {{ zabbix_version }} repository package
  apt:
    deb: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/debian/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+debian12_all.deb"
  # NOTE: from 7.4 onward Zabbix restructured their repo - packages live
  # under /<version>/release/debian/, NOT the older /<version>/debian/ path
  # (that older path still exists but is an empty placeholder and 404s).

- name: Update apt cache after adding the Zabbix repo
  apt:
    update_cache: yes

- name: Install Zabbix server, frontend and dependencies
  apt:
    name:
      - zabbix-server-pgsql
      - zabbix-frontend-php
      - php8.2-pgsql
      - zabbix-sql-scripts
      - zabbix-agent2
      - zabbix-nginx-conf
      - postgresql
      - php8.2-fpm
      - nginx
    state: present

- name: Ensure PostgreSQL is running
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: PostgreSQL setup (as the postgres system user)
  # become_method defaults to sudo (repo-wide ansible.cfg setting), but sudo
  # isn't installed on this minimal Debian image - su is, and is what was
  # actually used building this by hand, so pin it here rather than adding
  # a sudo dependency just for this.
  become_user: postgres
  become_method: su
  block:
    - name: Check whether the Zabbix DB role already exists
      command: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ zabbix_db_user }}'"
      register: zbx_role_check
      changed_when: false

    - name: Create the Zabbix DB role
      when: zbx_role_check.stdout != "1"
      command: psql -c "CREATE USER {{ zabbix_db_user }} WITH PASSWORD '{{ zabbix_db_password }}';"
      no_log: true

    - name: Check whether the Zabbix database already exists
      command: psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ zabbix_db_name }}'"
      register: zbx_db_check
      changed_when: false

    - name: Create the Zabbix database
      when: zbx_db_check.stdout != "1"
      command: createdb -O {{ zabbix_db_user }} -E Unicode -T template0 {{ zabbix_db_name }}

    - name: Check whether the schema is already imported
      command: psql -tAc "SELECT to_regclass('public.users')" {{ zabbix_db_name }}
      register: zbx_schema_check
      changed_when: false

- name: Import the Zabbix schema (first run only)
  when: "'users' not in zbx_schema_check.stdout"
  shell: >
    zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz |
    PGPASSWORD='{{ zabbix_db_password }}' psql -U {{ zabbix_db_user }} -h localhost {{ zabbix_db_name }}
  no_log: true

- name: Configure DBPassword in zabbix_server.conf
  # Matches whether the line is still the packaged "# DBPassword=" comment
  # or was already uncommented by a previous run - avoids appending a
  # duplicate line on the second run.
  lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?\s*DBPassword='
    line: "DBPassword={{ zabbix_db_password }}"
  no_log: true
  notify: Restart zabbix-server

- name: Configure zabbix.conf.php (pre-seeds DB connection, skips the setup wizard)
  template:
    src: zabbix.conf.php.j2
    dest: /etc/zabbix/web/zabbix.conf.php
    owner: www-data
    group: www-data
    mode: '0640'

- name: Fix nginx zabbix vhost - ensure all frontend paths point at /ui
  # Zabbix 7.4 moved the frontend into /usr/share/zabbix/ui/ (older
  # versions served it directly from /usr/share/zabbix/) - both the `root`
  # directive AND the three fastcgi_param lines (DOCUMENT_ROOT,
  # SCRIPT_FILENAME, PATH_TRANSLATED) hardcode this path. If
  # /etc/nginx/conf.d/zabbix.conf already existed from a prior version's
  # install, the package's postinst won't overwrite it and this goes stale
  # silently: "/" keeps 200ing from the distro default site while
  # /api_jsonrpc.php 404s, which reads like a working frontend until you
  # actually hit the API. Negative lookahead keeps this idempotent - won't
  # double up into /ui/ui on a second run.
  replace:
    path: /etc/nginx/conf.d/zabbix.conf
    regexp: '/usr/share/zabbix(?!/ui)'
    replace: '/usr/share/zabbix/ui'
  notify: Restart nginx

- name: Fix nginx zabbix vhost - enable the listen directive
  # The packaged template ships `listen 8080` commented out. Left as-is,
  # "/" still 200s from the distro default site while /api_jsonrpc.php
  # 404s, which looks like the frontend is up when it silently isn't.
  replace:
    path: /etc/nginx/conf.d/zabbix.conf
    regexp: '#\s*listen\s+8080;'
    replace: '    listen 80 default_server;'
  notify: Restart nginx

- name: Fix nginx zabbix vhost - set server_name
  replace:
    path: /etc/nginx/conf.d/zabbix.conf
    regexp: '#\s*server_name\s+example\.com;'
    replace: '    server_name  _;'
  notify: Restart nginx

- name: Remove the distro default nginx site
  # Also listens on 80 by default - conflicts with the zabbix vhost above.
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx

- name: Enable and start Zabbix server and dependent services
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - zabbix-server
    - php8.2-fpm
    - nginx

- name: Give the frontend a moment to come up before hitting the API
  wait_for:
    host: 127.0.0.1
    port: 80
    delay: 2

- name: Secure the frontend's default Admin password
  include_tasks: secure_frontend.yml

- name: Register customer proxies
  when: (zabbix_customer_proxies | default([])) | length > 0
  include_tasks: register_proxies.yml

- name: Install the backup script
  copy:
    src: export-zabbix-server.sh
    dest: /usr/local/bin/backup-zabbix-server.sh
    mode: '0750'

- name: Schedule the daily backup
  cron:
    name: "zabbix server backup"
    job: "/usr/local/bin/backup-zabbix-server.sh >> /var/log/zabbix-backup.log 2>&1"
    hour: "3"
    minute: "15"
