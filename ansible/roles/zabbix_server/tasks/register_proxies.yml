---
# Idempotently register each customer's proxy on the central server via the
# Zabbix API, so onboarding a new customer doesn't require clicking through
# the frontend by hand. Runs on the zabbix_server host.
#
# Expects `zabbix_customer_proxies`, a list of:
#   - name: zabbix-proxy-<customer>   # must match that proxy's Hostname=
#     operating_mode: active           # or passive - active is the default
#                                       # and the right choice for a proxy
#                                       # behind a customer's own NAT/firewall
#
# Requires zabbix_admin_password (vault) - the frontend's real admin
# password, set by secure_frontend.yml.

- name: Log in to the Zabbix API as Admin
  uri:
    url: "http://localhost/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Content-Type: "application/json-rpc"
    body:
      jsonrpc: "2.0"
      method: "user.login"
      params:
        username: "Admin"
        password: "{{ zabbix_admin_password }}"
      id: 1
    status_code: 200
  register: zbx_admin_login
  no_log: true
  # A wrong/stale zabbix_admin_password returns HTTP 200 with a JSON-RPC
  # error body (no .result), which every following task assumes exists -
  # fail here immediately with a clear message instead of a confusing
  # "dict has no attribute 'result'" crash three tasks downstream.
  failed_when: "'error' in zbx_admin_login.json"

- name: Check which of these proxies already exist
  uri:
    url: "http://localhost/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Content-Type: "application/json-rpc"
      Authorization: "Bearer {{ zbx_admin_login.json.result }}"
    body:
      jsonrpc: "2.0"
      method: "proxy.get"
      params:
        output: ["proxyid", "name"]
        filter:
          name: "{{ zabbix_customer_proxies | map(attribute='name') | list }}"
      id: 2
    status_code: 200
  register: zbx_existing_proxies
  no_log: true
  failed_when: "'error' in zbx_existing_proxies.json"

- name: Create any missing proxies
  loop: "{{ zabbix_customer_proxies }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (zbx_existing_proxies.json.result | map(attribute='name') | list)
  uri:
    url: "http://localhost/api_jsonrpc.php"
    method: POST
    body_format: json
    headers:
      Content-Type: "application/json-rpc"
      Authorization: "Bearer {{ zbx_admin_login.json.result }}"
    body:
      jsonrpc: "2.0"
      method: "proxy.create"
      params:
        name: "{{ item.name }}"
        # 0 = active (proxy dials the server), 1 = passive (server dials
        # the proxy) - active is right whenever the customer's site is
        # behind NAT/a firewall, which is the common case.
        operating_mode: "{{ 0 if (item.operating_mode | default('active')) == 'active' else 1 }}"
      id: 3
    status_code: 200
  register: zbx_proxy_create
  no_log: true
  failed_when: "'error' in zbx_proxy_create.json"
