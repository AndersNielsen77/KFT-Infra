---
zabbix_version: "7.4"

# Must match roles/zabbix_server's zabbix_version - the proxy refuses to
# sync config with a server on a different major version.

# Tunnel address of the central Zabbix server, e.g. "10.77.0.1"
zabbix_proxy_server: ""

# Unique per customer - this is how the proxy identifies itself to the
# server, and how the server tells proxies apart.
zabbix_proxy_hostname: ""
