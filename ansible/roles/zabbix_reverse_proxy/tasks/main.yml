---
# Exposes the Zabbix frontend through the same reverse-proxy container that
# already fronts the other *.nordspeed.dk sites, instead of requiring
# whoever needs the UI to know the internal vmbr1 IP.
#
# Matches the plain-HTTP pattern already used for the other vhosts on this
# host (cphweb, ihg, rundtombiler) rather than assuming a TLS setup - their
# HTTPS certs/config (where present) were set up by hand outside this repo,
# so adding TLS here is a separate manual step, not something this role
# guesses at.

- name: Template the Zabbix vhost
  template:
    src: zabbix_vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ zabbix_frontend_domain }}"
    mode: '0644'
  notify: Reload nginx

- name: Enable the Zabbix vhost
  file:
    src: "/etc/nginx/sites-available/{{ zabbix_frontend_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ zabbix_frontend_domain }}"
    state: link
  notify: Reload nginx
