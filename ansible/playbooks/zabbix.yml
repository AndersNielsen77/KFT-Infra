---
# Zabbix distributed monitoring: central server + one WireGuard-connected
# proxy per customer, plus the OVH host-level networking it depends on and
# the reverse-proxy vhost that exposes the frontend. See
# docs/zabbix-monitoring.md for the architecture, onboarding runbook, and
# disaster recovery procedure.
#
# Run everything:
#   ansible-playbook -i inventory/prod/hosts.yml playbooks/zabbix.yml
#
# Onboard (or re-converge) just one customer's proxy:
#   ansible-playbook -i inventory/prod/hosts.yml playbooks/zabbix.yml --limit zabbix_proxy_acme_corp

- name: Configure the OVH Proxmox host's networking (DNAT to zabbix-server)
  hosts: ovh_proxmox_host
  roles:
    - ovh_host_networking

- name: Configure the WireGuard tunnel - server side
  hosts: zabbix_server
  roles:
    - wireguard_tunnel

- name: Configure the WireGuard tunnel - proxy side(s)
  hosts: zabbix_proxies
  roles:
    - wireguard_tunnel

- name: Configure the central Zabbix server
  hosts: zabbix_server
  roles:
    - zabbix_server

- name: Configure each customer's Zabbix proxy
  hosts: zabbix_proxies
  roles:
    - zabbix_proxy

- name: Expose the Zabbix frontend through the reverse proxy
  hosts: zabbix_reverse_proxy
  roles:
    - zabbix_reverse_proxy
